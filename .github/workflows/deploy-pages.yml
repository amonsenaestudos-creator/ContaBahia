# Publica o site no GitHub Pages.
#
# - Push na branch main (ou "Run workflow" na aba Actions): gera o site estático e publica.
# - Pull request para a main: só gera o site, para conferir se o build funciona antes do merge.
#
# Requisito (uma vez só): Settings → Pages → Build and deployment → Source = "GitHub Actions".
#
# Configurações opcionais em Settings → Secrets and variables → Actions → aba "Variables":
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#     → o formulário grava os contatos no Supabase e o blog lê os artigos de lá.
#       Sem elas, o formulário abre o e-mail do visitante e o blog mostra os artigos de exemplo.
#   NEXT_PUBLIC_CONTACT_PHONE, NEXT_PUBLIC_CONTACT_EMAIL, NEXT_PUBLIC_OFFICE_LOCATION,
#   NEXT_PUBLIC_WHATSAPP_NUMBER, NEXT_PUBLIC_WHATSAPP_DISPLAY
#     → substituem os dados de contato padrão definidos em src/lib/site.ts.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gerar site estático
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Ler configuração do GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site (next build → pasta out/)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # "/ContaBahia" em https://<usuario>.github.io/ContaBahia/ (vazio com domínio próprio)
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CONTACT_PHONE: ${{ vars.NEXT_PUBLIC_CONTACT_PHONE }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_OFFICE_LOCATION: ${{ vars.NEXT_PUBLIC_OFFICE_LOCATION }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_WHATSAPP_DISPLAY: ${{ vars.NEXT_PUBLIC_WHATSAPP_DISPLAY }}

      - name: Empacotar o site para o GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
